version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: imagekey_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: imagekey_user
      POSTGRES_PASSWORD: imagekey_secret
      POSTGRES_DB: imagekey_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imagekey_user -d imagekey_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
